services:
  postgres:
    image: postgres:16-alpine
    container_name: uangku-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private PostgreSQL password}
      POSTGRES_DB: uangku
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uangku"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: uangku-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private PostgreSQL password}
      STORAGE_LOCAL_DIR: /var/lib/uangku/uploads
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET of at least 32 characters}
    volumes:
      - receipt_data:/var/lib/uangku/uploads
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  receipt_data:
